<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>दूसरी तिजोरी · Live Wall</title>
<style>
:root{--g:#0B3D24;--g2:#12492d;--gold:#B8913A;--gold2:#e8cd86;--cream:#F6F3EA}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#14563a 0%,#0B3D24 70%);color:var(--cream);font-family:'Inter','Segoe UI',Roboto,'Noto Sans Devanagari','Nirmala UI',Arial,system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:10vh 6vw 6vh}#stage>*:first-child{margin-top:auto}#stage>*:last-child{margin-bottom:auto}
.tight .bar{margin:1vh 0}.tight .bar .t{height:3.6vh}.tight .bar .l{font-size:1.9vw}.tight .box{padding:1.8vh 1.4vw}.tight .box .v{font-size:4vw}.tight .row{margin-top:1.8vh}
.top{position:absolute;top:2.2vh;left:3vw;right:3vw;display:flex;justify-content:space-between;align-items:center}
.top img.c{height:7vh;width:7vh;border-radius:50%;border:.25vh solid var(--gold);background:#fff}
.top img.p{height:6vh;background:#fff;border-radius:1vh;padding:.4vh 1vh}
.foot{position:absolute;bottom:1.8vh;left:6vw;right:6vw;text-align:center;font-size:1.15vw;opacity:.6}
.kick{color:var(--gold2);font-size:2vw;letter-spacing:.07em;margin-bottom:1.6vh;text-transform:uppercase}
.h{font-size:4.6vw;font-weight:800;line-height:1.15}.h2{font-size:3.1vw;font-weight:700;line-height:1.25}
.sub{font-size:2.1vw;opacity:.88;margin-top:2vh;line-height:1.4}
.huge{font-size:13vw;font-weight:800;color:var(--gold2);line-height:1}
.hi{display:block;font-size:.72em;opacity:.85;font-weight:600}
.row{display:flex;gap:2.6vw;align-items:stretch;margin-top:3vh}
.box{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(232,205,134,.35);border-radius:1.6vw;padding:3vh 1.6vw;text-align:center}
.box .v{font-size:6vw;font-weight:800;color:var(--gold2)}.box .l{font-size:1.8vw;opacity:.92}
.bar{margin:2vh 0}.bar .l{font-size:2.1vw;display:flex;justify-content:space-between;gap:2vw}
.bar .t{height:5vh;background:rgba(255,255,255,.12);border-radius:1vh;overflow:hidden;margin-top:.8vh}
.bar .f{height:100%;background:var(--gold);width:0;transition:width 1.6s ease}.bar.hl .f{background:#f0cf74;box-shadow:0 0 2vh rgba(240,207,116,.7)}.bar.hl .l b{color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:1.1vw;margin-top:3vh}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(232,205,134,.4);border-radius:999px;padding:1.1vh 1.6vw;font-size:1.75vw;opacity:0;animation:cf 1.6s ease forwards}
.chip.be{border-color:#8fd3a8}.chip.do{border-color:#8fb7e8}.chip.give{border-color:var(--gold2)}
@keyframes cf{from{opacity:0;transform:translateY(1.2vh)}to{opacity:1;transform:none}}
.fade{animation:f .8s ease}@keyframes f{from{opacity:0;transform:translateY(1.5vh)}to{opacity:1;transform:none}}
.wait{font-size:3vw;opacity:.85}
.two{display:flex;gap:4vw;align-items:center}.two>div:first-child{flex:1.5}.two>div:last-child{flex:1}
.qrcard{background:#fff;border-radius:1.6vw;padding:1.4vw;text-align:center;color:var(--g);border:.4vh solid var(--gold)}
.qrcard svg{width:100%;height:auto;display:block}.qrcard b{display:block;font-size:1.5vw;margin-top:.8vh}
.cnt{font-size:5.4vw;font-weight:800;color:var(--gold2);line-height:1.1;margin-top:2vh}.cnt small{font-size:1.9vw;color:var(--cream);font-weight:600;display:block;opacity:.85}
.tmr{font-size:5vw;font-weight:800;color:#fff;margin-top:1.5vh}.tmr.low{color:#ff9d8a}
.qs{margin-top:2.4vh;font-size:2.3vw;line-height:1.35;padding-left:0;list-style:none}.qs li{margin:1.3vh 0;display:flex;gap:1.2vw}.qs li b{color:var(--gold2);flex:none}
table.t{width:100%;border-collapse:collapse;margin-top:3vh;font-size:2.7vw}table.t td{padding:1.8vh 1.4vw;border-bottom:1px solid rgba(232,205,134,.3)}table.t td:last-child{text-align:right;font-weight:800;color:var(--gold2);white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2vw;margin-top:3vh;position:relative}
.grid .q{background:rgba(255,255,255,.07);border:1px solid rgba(232,205,134,.4);border-radius:1.6vw;padding:3vh 2vw}.grid .q b{font-size:5vw;color:var(--gold2);margin-right:1.2vw}.grid .q span{font-size:2.2vw}
.axis{display:flex;justify-content:space-between;font-size:1.8vw;color:var(--gold2);margin-top:2vh;padding:0 2vw}
.logos{display:flex;gap:3vw;align-items:center;margin-bottom:3vh}.logos img.c{height:13vh;width:13vh;border-radius:50%;border:.4vh solid var(--gold);background:#fff}.logos img.p{height:11vh;background:#fff;border-radius:1.4vh;padding:.8vh 1.4vh}
.center{text-align:center;align-items:center}.center .logos{justify-content:center}
.lay{display:flex;flex-direction:column-reverse;gap:1.6vh;margin-top:2vh}.lay .r{display:flex;align-items:center;gap:1.5vw;opacity:0}.lay .r.show{opacity:1;transition:opacity .6s}
.lay .n{width:17vw;font-size:2.2vw;font-weight:700}.lay .t{flex:1;height:5.6vh;background:rgba(255,255,255,.1);border-radius:1vh;overflow:hidden}.lay .f{height:100%;background:var(--gold);width:0;transition:width 1.4s ease}.lay .c{width:7vw;text-align:right;font-size:2.2vw;font-weight:800}
.lay .r.low .f{background:#e08a74}
#pinbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--g);z-index:5}
#pinbox input{font-size:2vw;padding:1.5vh 1vw;border-radius:1vh;border:0;width:22vw}#pinbox button{font-size:2vw;padding:1.5vh 2vw;border-radius:1vh;border:0;background:var(--gold);color:#fff;margin-left:1vw}
</style></head><body>

<script>
var PIN=null,LAST='',SKEW=0,TIMER=null,W=null;
try{PIN=sessionStorage.getItem('sv_pin');}catch(e){}
function call(fn){var a=Array.prototype.slice.call(arguments,1);return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,a);});}
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function pct(x){return x==null?'—':Math.round(x*100)+'%';}
$('go').onclick=function(){PIN=$('pin').value;start();};
function start(){call('wGet',PIN).then(function(w){try{sessionStorage.setItem('sv_pin',PIN);}catch(e){}$('pinbox').style.display='none';show(w);setInterval(poll,3000);setInterval(tick,400);})
  .catch(function(e){var m=String(e&&e.message||e),i=m.indexOf('SV|');alert(i<0?m:m.slice(i+3));});}
function poll(){call('wGet',PIN).then(show).catch(function(){});}
function show(w){SKEW=w.now-Date.now();W=w;var sig=w.view+'|'+w.at+'|'+JSON.stringify(w.data)+'|'+w.question;if(sig===LAST)return;
  var same=LAST.split('|')[0]===w.view&&LAST.split('|')[1]===String(w.at);LAST=sig;render(w,!same);}
function tick(){var el=$('tmr');if(!el||!W||!W.timer){if(el)el.textContent='';return;}var s=Math.max(0,Math.round((W.timer.end-(Date.now()+SKEW))/1000));el.textContent=Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);el.className='tmr'+(s<=15?' low':'');}
function animate(){setTimeout(function(){Array.prototype.forEach.call(document.querySelectorAll('[data-w]'),function(el){el.style.width=el.getAttribute('data-w');});
  var i=0;Array.prototype.forEach.call(document.querySelectorAll('.lay .r'),function(el){setTimeout(function(){el.classList.add('show');var f=el.querySelector('.f');if(f)f.style.width=f.getAttribute('data-w');},i*900);i++;});},60);}
function countUp(el,to){var t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/1500);el.textContent=Math.round(to*p).toLocaleString('en-IN');if(p<1)requestAnimationFrame(f);})(t0);}
function bar(label,v,hl){var p=Math.round((v||0)*100);return '<div class="bar'+(hl?' hl':'')+'"><div class="l"><span>'+label+'</span><b>'+p+'%</b></div><div class="t"><div class="f" data-w="'+p+'%"></div></div></div>';}
function qr(){return '<div class="qrcard">'+$('qrsrc').innerHTML+'<b>Scan to join · स्कैन करें</b></div>';}
function locked(d,title){return '<div class="kick">'+title+'</div><div class="wait">Responses coming in… '+(d?d.n:0)+'</div>';}
var ACT={G1:{t:'G1 · Reality Check|रियलिटी चेक',q:['Which quadrant does your biggest income come from? E · S · B · I|आपकी सबसे बड़ी income किस quadrant से?','If unreachable for 6 months, what happens to revenue?|6 महीने unreachable रहें तो revenue?','Hours of work per week?|हफ़्ते में काम के घंटे?','Phone-free family evenings, last 7 days?|पिछले 7 दिन phone-free family evenings?']},
 G2:{t:'G2 · Money Snapshot|मनी स्नैपशॉट',q:['Monthly household expenses|घर का monthly खर्च','Total monthly income|कुल monthly income','Income that arrives without you, per month|आपके बिना आने वाली income','Investments outside business and real estate|business/real estate के बाहर निवेश','Share of net worth in business / real estate|net worth का कितना % business/real estate में','Your “Enough” number|आपका “Enough” number']},

function bi(s){var p=s.split('|');return esc(p[0])+(p[1]?'<span class="hi">'+esc(p[1])+'</span>':'');}
function openView(a,d,w){var m=ACT[a],n=d.counts[a]||0,tot=d.checkin.n;
  return '<div class="two"><div><div class="kick">'+bi(m.t)+'</div><ul class="qs">'+m.q.map(function(x,i){return '<li><b>'+(i+1)+'</b><span>'+bi(x)+'</span></li>';}).join('')+'</ul></div>'+
  '<div>'+qr()+'<div class="cnt">'+n+' <small>of '+tot+' responded · में से जवाब आए</small></div><div class="tmr" id="tmr"></div></div></div>';}

function render(w,fresh){var v=w.view,d=w.data,h='',st=$('stage');st.className='';
  if(v==='preloop')h='<div class="two"><div><div class="kick">आज का सवाल · Tonight’s question</div><div class="h">अगर आप 6 महीने offline हो जाएँ, तो family का monthly cash flow कहाँ से आएगा?<span class="hi" style="margin-top:2vh">If you were offline for 6 months, where would your family’s monthly cash flow come from?</span></div></div>'+
    '<div>'+qr()+'<div class="cnt">'+d.checkin.n+' <small>guests checked in · check-in हो चुके</small></div></div></div>';
  else if(v==='title'||v==='closing'){st.className='center';h='<div class="logos"><img class="c" src="cia.jpg"><img class="p" src="pv.jpg"></div>'+
    (v==='title'?'<div class="h" style="font-size:8vw">दूसरी तिजोरी</div><div class="h" style="color:var(--gold2)">The Second Vault</div><div class="sub">From Business to Legacy</div>':

  else if(v==='blank')h='';
  else if(v==='esb')h='<div class="kick">The Cashflow Quadrant</div><div class="grid"><div class="q"><b>E</b><span>Employee<br>आपके पास एक job है</span></div><div class="q"><b>B</b><span>Business owner<br>आपके बिना चलने वाला system</span></div><div class="q"><b>S</b><span>Self-employed / Specialist<br>आप अपनी job के owner हैं</span></div><div class="q"><b>I</b><span>Investor<br>आपका capital आपके लिए काम करता है</span></div></div><div class="axis"><span>◀ आपका समय · Time</span><span>Assets · आपकी संपत्ति ▶</span></div>';
  else if(v==='g1open')h=openView('G1',d,w);else if(v==='g2open')h=openView('G2',d,w);else if(v==='g3open')h=openView('G3',d,w);else if(v==='b8open')h=openView('B8',d,w);
  else if(v==='g1gap'){var g=d.G1;h=g.locked?locked(g,'Reality Check'):'<div class="kick">'+g.n+' guests · '+g.n+' जवाब</div>'+bar('खुद को <b>B</b> मानते हैं · See themselves as B',g.selfB)+bar('6 महीने आपके बिना business वैसा ही चलेगा · Runs as usual without them for 6 months',g.same,true)+'<div class="sub">यही gap आज की शाम का पहला सच है।</div>';}
  else if(v==='g2wall'){st.className='tight';var q=d.G2;h=q.locked?locked(q,'Money Snapshot'):'<div class="kick">'+q.n+' जवाब · आपकी income का कितना % आपके बिना आता है</div>'+
    ['0%','1–10%','10–25%','25–50%','50%+'].map(function(l,i){return bar(l,q.hist[i]/q.n,i===0);}).join('')+'<div class="row"><div class="box"><div class="v">'+pct(q.medPassive)+'</div><div class="l">Median passive share of income</div></div><div class="box"><div class="v">'+pct(q.medCoverage)+'</div><div class="l">Median: share of expenses covered without you</div></div></div>';}
  else if(v==='roce'||v==='roce9'){h='<div class="kick">Illustrative example · राघव का business</div><table class="t"><tr><td>Profit / मुनाफ़ा</td><td>₹30 lakh</td></tr><tr><td>Capital employed / लगी पूँजी</td><td>₹2 crore</td></tr><tr><td>CEO का market salary (आपके श्रम का दाम)</td><td>₹12 lakh</td></tr><tr><td>Hours put in per year / सालाना घंटे</td><td>≈ 3,900</td></tr></table>'+
    (v==='roce9'?'<div class="row"><div class="box"><div class="l">(₹30 lakh − ₹12 lakh) ÷ ₹2 crore</div><div class="v" style="font-size:9vw">9%</div><div class="l">True ROCE · लगभग risk-free return, जबकि पूरा risk आपका</div></div></div>':'<div class="sub">True ROCE = ?</div>');}
  else if(v==='g1time'){var t=d.G1;h=t.locked?locked(t,'Time & Enough'):'<div class="kick">इस hall का median · '+t.n+' जवाब</div><div class="row"><div class="box"><div class="v" style="font-size:4.4vw">'+esc(t.hoursMed)+'</div><div class="l">hours of work per week · हफ़्ते के घंटे</div></div><div class="box"><div class="v" style="font-size:4.4vw">'+esc(t.eveMed)+'</div><div class="l">phone-free family evenings, last 7 days · पिछले 7 दिन</div></div></div>';}
  else if(v==='conc'){var c=d.G2;h=c.locked?locked(c,'Where our wealth sits'):'<div class="kick">Net worth in business / real estate · '+c.n+' जवाब</div>'+['Below 25%','25–50%','50–75%','75% or more'].map(function(l,i){return bar(l,c.conc[i]/c.n,i===3);}).join('')+'<div class="sub"><b>'+pct(c.conc75)+'</b> की 75% से ज़्यादा wealth एक ही जगह बंद है।</div>';}
  else if(v==='barbell'){st.className='center';h='<div class="h" style="font-size:6.2vw">Business + Second Vault</div><div class="h" style="color:var(--gold2);font-size:8vw">= Balance</div>';}
  else if(v==='g3next'){var x=d.G3;h=x.locked?locked(x,'Legacy Check'):'<div class="kick">क्या आपके बच्चे business संभालेंगे? · '+x.n+' जवाब</div>'+['Yes · हाँ','No · नहीं','Not sure · पता नहीं','Never asked them · कभी पूछा ही नहीं'].map(function(l,i){return bar(l,x.next[i]/x.n,i===3);}).join('')+'<div class="sub"><b>'+pct(x.never)+'</b> ने अपने बच्चों से यह सवाल कभी पूछा ही नहीं।</div>';}
  else if(v==='g3layers'){var y=d.G3;h=y.locked?locked(y,'Legacy layers'):'<div class="kick">जो layers आज सच में in place हैं · '+y.n+' जवाब</div><div class="lay">'+['Protect','Separate','Grow','Structure','Transfer'].map(function(l,i){var p=Math.round(y.layers[i]*100);return '<div class="r'+(i>=3?' low':'')+'"><div class="n">'+(i+1)+' · '+l+'</div><div class="t"><div class="f" data-w="'+p+'%"></div></div><div class="c">'+p+'%</div></div>';}).join('')+'</div>';}
  else if(v==='dreams'){var ds=d.dreams||[];h='<div class="kick">आज शाम की शुरुआत में आपने लिखा था…</div><div class="chips">'+(ds.length?ds.map(function(m,i){return '<span class="chip '+esc(m.k)+'" style="animation-delay:'+(i*0.9)+'s">'+esc(m.t)+'</span>';}).join(''):'<span class="wait">…</span>')+'</div>';}
  else if(v==='question')h='<div class="kick">आपका सवाल · Your question</div><div class="h2" style="font-size:3.6vw">'+esc(w.question||'…')+'</div>';
  st.innerHTML=h;if(fresh)st.className=(st.className+' fade').trim();
  animate();tick();
}
if(PIN)start();
</script></body></html>
