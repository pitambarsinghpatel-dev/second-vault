<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>दूसरी तिजोरी — The Second Vault</title>
<style>
:root{--g:#0B3D24;--gold:#B8913A;--tint:#F6F3EA;--ink:#1c1c1c;--mut:#6b6b6b;--line:#e4dccb;--ok:#1f7a4d;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter','Segoe UI',Roboto,'Noto Sans Devanagari','Nirmala UI',Arial,system-ui,sans-serif;background:var(--tint);color:var(--ink);font-size:17px;line-height:1.5}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header img.c{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);background:#fff}
header img.p{height:30px;background:#fff;border-radius:6px;padding:2px 5px;margin-left:auto}
header .t{font-weight:700;font-size:17px;line-height:1.2}header .s{font-size:11px;color:#e9dcc0}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:20px;margin:0 0 6px;color:var(--g)}h3{font-size:17px;margin:0 0 4px}
label.q{display:block;font-weight:600;margin:16px 0 6px}
.en{display:block}.hi{display:block;font-size:.88em;color:#5b5b5b;font-weight:400}
.opt .hi,label.q .hi{margin-top:1px}
input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:62px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.opt input{margin-top:5px;width:20px;height:20px;accent-color:var(--g);flex:none}
.opt.sel{border-color:var(--g);background:#eef5f0}
.chk{display:flex;gap:12px;align-items:flex-start;margin:14px 0;font-size:15px}
.chk input{margin-top:4px;width:22px;height:22px;accent-color:var(--g);flex:none}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:18px;margin-top:16px}
.btn.gold{background:var(--gold)}.btn.ghost{background:#fff;color:var(--g);border:1.5px solid var(--g)}.btn:disabled{opacity:.55}
.err{color:var(--err);font-size:15px;margin-top:10px;min-height:1em}
.muted{color:var(--mut);font-size:14px}.help{font-size:13px;color:var(--mut);margin:-2px 0 8px}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}
.badge{font-size:13px;padding:5px 12px;border-radius:999px;background:#eee;color:#555;white-space:nowrap}
.badge.open{background:var(--gold);color:#fff}.badge.done{background:#e6f2ea;color:var(--ok)}
.big{font-size:30px;font-weight:800;color:var(--g);line-height:1.2}
.res{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}.res:last-child{border:0}.res b{color:var(--g);text-align:right}
.wait{text-align:center;padding:26px 14px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--gold);margin:0 auto 12px;animation:p 1.4s infinite}
@keyframes p{0%{transform:scale(.8);opacity:.5}50%{transform:scale(1.2);opacity:1}100%{transform:scale(.8);opacity:.5}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.seg button{padding:12px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:16px}
.seg button.sel{background:var(--g);color:#fff;border-color:var(--g)}
.hide{display:none}.disc{font-size:12px;color:var(--mut);margin-top:12px}
</style></head>
<body>
<header><img class="c" src="cia.jpg"><div><div class="t">दूसरी तिजोरी · The Second Vault</div><div class="s">Your answers stay private · आपके जवाब निजी रहेंगे</div></div><img class="p" src="pv.jpg"></header>
<main id="app"><div class="wait"><div class="pulse"></div>Loading…</div></main>
<script src="gas.js"></script>
<script>
var TOKEN=null,STATE=null,POLL=null,VIEW='home',AUTO={};
try{TOKEN=localStorage.getItem('sv_token');}catch(e){}
function call(fn){var a=Array.prototype.slice.call(arguments,1);
  function once(){return new Promise(function(res,rej){google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej(e&&e.message?e:new Error(String(e)));})[fn].apply(null,a);});}
  function ours(e){var m=String(e&&e.message||e),i=m.indexOf('SV|');return i<0?null:new Error(m.slice(i+3));}
  return once().catch(function(e){if(ours(e))throw ours(e);
    return new Promise(function(r){setTimeout(r,1200+Math.random()*1500);}).then(once).catch(function(e2){if(ours(e2))throw ours(e2);throw new Error('Network is slow. Please tap again. नेटवर्क धीमा है, कृपया दोबारा tap करें।');});});}
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function bi(s){var p=String(s).split('|');return '<span class="en">'+esc(p[0])+'</span>'+(p[1]?'<span class="hi">'+esc(p[1])+'</span>':'');}
function inr(n){if(n==null||isNaN(n))return '—';var a=Math.abs(n);if(a>=1e7)return '₹'+(n/1e7).toFixed(2).replace(/\.?0+$/,'')+' crore';if(a>=1e5)return '₹'+(n/1e5).toFixed(1).replace(/\.0$/,'')+' lakh';return '₹'+Math.round(n).toLocaleString('en-IN');}
function pct(x){return x==null?'—':Math.round(x*100)+'%';}

function renderLogin(msg){stopPoll();
  $('app').innerHTML='<div class="card"><h2>Welcome · स्वागत है</h2><p class="muted">Sign in once for tonight’s session.<br>आज की शाम के लिए बस एक बार sign in कीजिए।</p>'+
  '<div class="seg" id="who"><button data-w="self" class="sel">Registered<br><small>रजिस्टर्ड</small></button><button data-w="guest">Walk-in guest<br><small>नए अतिथि</small></button></div>'+
  '<div id="f-reg"><label class="q">'+bi('Registration number (e.g. 7 or SV-007)|रजिस्ट्रेशन नंबर (जैसे 7 या SV-007)')+'</label><input id="reg" type="text" inputmode="numeric" autocomplete="off" placeholder="7">'+
  '<label class="q">'+bi('Last 4 digits of your registered mobile|रजिस्टर्ड मोबाइल के आख़िरी 4 अंक')+'</label><input id="last4" type="tel" inputmode="numeric" maxlength="4" placeholder="1234"></div>'+
  '<div id="f-guest" class="hide"><label class="q">'+bi('Your name|आपका नाम')+'</label><input id="gname" type="text"><label class="q">'+bi('Mobile number (WhatsApp)|मोबाइल नंबर (WhatsApp)')+'</label><input id="gmob" type="tel" inputmode="numeric" maxlength="10">'+
  '<label class="q">Email</label><input id="gemail" type="email"><label class="q">'+bi('Business / profession|व्यवसाय / पेशा')+'</label><input id="gprof" type="text"></div>'+
  '<label class="chk"><input type="checkbox" id="consent"><span>I agree that my answers will be used only to prepare my personal Second Vault Blueprint and for follow-up by P&amp;V WealthGrow, and not shared with anyone else.<br><span class="hi">मेरे जवाब सिर्फ़ मेरी personal Blueprint बनाने और P&amp;V WealthGrow के follow-up के लिए उपयोग होंगे, किसी और से साझा नहीं होंगे।</span></span></label>'+
  '<button class="btn" id="go">Start · शुरू करें</button><div class="err" id="err">'+esc(msg||'')+'</div></div>';
  var who='self';
  Array.prototype.forEach.call(document.querySelectorAll('#who button'),function(b){b.onclick=function(){who=b.getAttribute('data-w');
    Array.prototype.forEach.call(document.querySelectorAll('#who button'),function(x){x.classList.toggle('sel',x===b);});
    $('f-reg').classList.toggle('hide',who==='guest');$('f-guest').classList.toggle('hide',who!=='guest');};});
  $('go').onclick=function(){var req={who:who,consent:$('consent').checked};
    if(!req.consent){$('err').textContent='Please tick the consent box. कृपया सहमति box tick करें।';return;}
    if(who==='guest'){req.name=$('gname').value;req.mobile=$('gmob').value;req.email=$('gemail').value;req.profession=$('gprof').value;}
    else{req.reg=$('reg').value;req.last4=$('last4').value;if(!req.reg.trim()){$('err').textContent='Please enter your registration number. रजिस्ट्रेशन नंबर लिखिए।';return;}}
    $('go').disabled=true;$('err').textContent='';
    call('pCheckIn',req).then(function(r){$('go').disabled=false;TOKEN=r.token;try{localStorage.setItem('sv_token',TOKEN);}catch(e){}AUTO={};home();})
      .catch(function(e){$('go').disabled=false;$('err').textContent=e.message;});};}

function home(){VIEW='home';call('pState',TOKEN).then(function(s){STATE=s;renderHome();startPoll();})
  .catch(function(e){try{localStorage.removeItem('sv_token');}catch(x){}TOKEN=null;renderLogin(e.message);});}
var TITLES={B0:'Dream Board|ड्रीम बोर्ड',G1:'Reality Check|रियलिटी चेक',G2:'Money Snapshot|मनी स्नैपशॉट',G3:'Legacy Check|लेगेसी चेक',B8:'30-Day Action|30-दिन का एक कदम'};
function renderHome(){var s=STATE,pending=s.open.filter(function(a){return s.done.indexOf(a)<0;});
  var h='<div class="card"><h2>Welcome, '+esc(s.name)+'</h2><p class="muted">New activities appear here when announced from the stage. Please keep this page open.<br>मंच से घोषणा होते ही नई activity यहीं खुलेगी। कृपया यह page खुला रखें।</p></div>';
  s.open.concat(s.done.filter(function(d){return s.open.indexOf(d)<0;})).forEach(function(a){var dn=s.done.indexOf(a)>=0;
    h+='<div class="card act" data-a="'+a+'"><div><h3>'+bi(TITLES[a])+'</h3><div class="muted">'+(dn?'Completed · tap to view':'Open now · tap to fill')+'</div></div><span class="badge '+(dn?'done':'open')+'">'+(dn?'✓':'Open')+'</span></div>';});
  if(!pending.length)h+='<div class="card wait"><div class="pulse"></div><b>The next activity will open soon…</b><div class="muted">अगली activity जल्द खुलेगी</div><button class="btn ghost" id="refresh">Refresh · ताज़ा करें</button></div>';
  if(s.qOpen)h+='<div class="card"><h3>Ask the speakers a question|</h3><textarea id="qtext" maxlength="300" placeholder="Your question (name not shown) · आपका सवाल (नाम नहीं दिखेगा)"></textarea><button class="btn gold" id="ask">Send · भेजें</button><div class="err" id="qerr"></div></div>';
  h+='<p class="disc">Educational reflection tool, not investment advice. Figures are illustrations from your own ranges. · शैक्षिक tool, निवेश सलाह नहीं।</p>';
  $('app').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),function(el){el.onclick=function(){openActivity(el.getAttribute('data-a'));};});
  if($('refresh'))$('refresh').onclick=home;
  if($('ask'))$('ask').onclick=function(){$('ask').disabled=true;call('pAsk',TOKEN,$('qtext').value).then(function(){$('qtext').value='';$('qerr').style.color='var(--ok)';$('qerr').textContent='Sent. Thank you! भेज दिया, धन्यवाद!';$('ask').disabled=false;}).catch(function(e){$('qerr').textContent=e.message;$('ask').disabled=false;});};
  if(pending.length===1&&!AUTO[pending[0]]){AUTO[pending[0]]=1;openActivity(pending[0]);}}   // one new activity: open it straight away
function startPoll(){stopPoll();POLL=setTimeout(function tick(){if(VIEW==='home'&&TOKEN){call('pState',TOKEN).then(function(s){var ch=JSON.stringify(s)!==JSON.stringify(STATE);STATE=s;
  var typing=document.activeElement&&document.activeElement.id==='qtext';if(ch&&VIEW==='home'&&!typing)renderHome();}).catch(function(){});}
  POLL=setTimeout(tick,9000+Math.random()*5000);},9000+Math.random()*5000);}
function stopPoll(){if(POLL)clearTimeout(POLL);POLL=null;}

function openActivity(aid){VIEW='act';$('app').innerHTML='<div class="wait"><div class="pulse"></div>Opening…</div>';
  call('pGetActivity',TOKEN,aid).then(function(def){if(def.done&&def.result)renderResult(aid,def.result);else renderForm(def);}).catch(function(e){alert(e.message);home();});}
function renderForm(def){var ans={};
  var h='<div class="card"><h2>'+bi(def.title)+'</h2>'+(def.intro?'<p class="muted">'+bi(def.intro)+'</p>':'');
  def.fields.forEach(function(f){var id='f_'+f.id;
    if(f.type==='commit')return;
    if(f.type==='check'){h+='<label class="chk"><input type="checkbox" id="'+id+'"><span>'+bi(f.label)+'</span></label>';return;}
    h+='<label class="q">'+bi(f.label)+'</label>'+(f.help?'<div class="help">'+bi(f.help)+'</div>':'');
    if(f.type==='choice')h+='<div class="opts">'+f.options.map(function(o){return '<label class="opt"><input type="radio" name="'+id+'" value="'+esc(o[0])+'"><span>'+bi(o[1])+'</span></label>';}).join('')+'</div>';
    else if(f.type==='multi')h+='<div class="opts">'+f.options.map(function(o){return '<label class="opt"><input type="checkbox" name="'+id+'" value="'+esc(o[0])+'"><span>'+bi(o[1])+'</span></label>';}).join('')+'</div>';
    else if(f.type==='select')h+='<select id="'+id+'"><option value="">Select · चुनें</option>'+f.options.map(function(o){return '<option value="'+o+'">'+o+'</option>';}).join('')+'</select>';
    else h+='<textarea id="'+id+'" maxlength="'+(f.max||200)+'"></textarea>';});
  var cm=def.fields.filter(function(f){return f.type==='commit';})[0];
  h+='<button class="btn '+(cm?'gold':'')+'" id="sub">'+(cm?esc(cm.label.split('|')[0])+' · '+esc((cm.label.split('|')[1]||'')):'Submit · जमा करें')+'</button><button class="btn ghost" id="back">Back · वापस</button><div class="err" id="err"></div></div>';
  $('app').innerHTML=h;window.scrollTo(0,0);
  Array.prototype.forEach.call(document.querySelectorAll('.opt input'),function(r){r.onchange=function(){Array.prototype.forEach.call(document.querySelectorAll('input[name="'+r.name+'"]'),function(x){x.parentNode.classList.toggle('sel',x.checked);});};});
  $('back').onclick=home;
  $('sub').onclick=function(){
    def.fields.forEach(function(f){var id='f_'+f.id;
      if(f.type==='check')ans[f.id]=$(id).checked;else if(f.type==='commit')ans[f.id]=true;
      else if(f.type==='choice'){var c=document.querySelector('input[name="'+id+'"]:checked');if(c)ans[f.id]=c.value;}
      else if(f.type==='multi'){ans[f.id]=Array.prototype.map.call(document.querySelectorAll('input[name="'+id+'"]:checked'),function(x){return x.value;});}
      else{var v=$(id).value.trim();if(v!=='')ans[f.id]=v;else delete ans[f.id];}});
    $('sub').disabled=true;$('err').textContent='';
    call('pSubmit',TOKEN,def.id,ans).then(function(r){renderResult(def.id,r);}).catch(function(e){$('sub').disabled=false;$('err').textContent=e.message;});};}

var LAYER={protect:'Protect',separate:'Separate',grow:'Grow',structure:'Structure',transfer:'Transfer'};
function renderResult(aid,r){VIEW='act';var h='<div class="card"><h2>'+bi(TITLES[aid])+' ✓</h2>';
  if(aid==='B0')h+='<p>Your Dream Board is saved ('+r.dreams+' of 3 dreams). It returns to the big screen later tonight, without names.</p><p class="muted">आपका Dream Board सुरक्षित है। आज रात यह बिना नाम के बड़ी screen पर लौटेगा।</p>';
  else if(aid==='G1'){h+=(r.selfB&&r.dependent?'<p>You see yourself as <b>B</b>, yet your business needs you for its revenue. That is the <b>S</b> quadrant, and you are in good company.</p><p class="muted">आप खुद को B मानते हैं, पर revenue के लिए business को आपकी ज़रूरत है। यह S quadrant है।</p>':'<p>Your answers are recorded. The hall’s picture appears on the screen.</p><p class="muted">आपके जवाब दर्ज हो गए। पूरे hall की तस्वीर screen पर आएगी।</p>')+
    '<p class="muted" style="margin-top:10px">At this pace, 35 working years ≈ '+Math.round(r.hoursLife).toLocaleString('en-IN')+' hours.</p>';}
  else if(aid==='G2'){h+='<p>Money that arrives without you, as a share of your income (approx.)</p><div class="big">'+pct(r.passivePct)+'</div>'+
    '<div class="res"><span>Share of household expenses it covers · खर्च का कितना हिस्सा</span><b>'+pct(r.coverage)+'</b></div>'+
    '<div class="res"><span>Your “Freedom Number” today ('+r.multiple+'× yearly expenses)</span><b>'+inr(r.freedomToday)+'</b></div>'+
    '<div class="res"><span>Passive income still needed to reach your “Enough”</span><b>'+(r.enoughGap?inr(r.enoughGap)+'/month':'Reached ✓')+'</b></div>'+
    '<div class="res"><span>Net worth in business / real estate · हिस्सा</span><b>'+esc(r.concLabel)+'</b></div>'+
    '<p class="muted" style="margin-top:10px">Estimates from the ranges you chose. Your full roadmap reaches you within 48 hours.<br>आपकी चुनी range से अनुमान। पूरा roadmap 48 घंटे में आपके पास होगा।</p>';}
  else if(aid==='G3'){h+='<p>'+r.have+' of 5 layers are in place today.</p>'+(r.missing.length?'<p><b>Still empty:</b> '+r.missing.map(function(k){return LAYER[k];}).join(', ')+'.</p>':'<p>All five in place. Excellent.</p>')+'<p class="muted">आज 5 में से '+r.have+' layers in place हैं।</p>';}
  else if(aid==='B8')h+='<div class="big">Thank you.</div><p>Your 30-day step is recorded. Your personal Second Vault Blueprint reaches you on WhatsApp and email within 48 hours.</p><p class="muted">आपकी personal Blueprint 48 घंटे में WhatsApp और email पर आएगी।</p>';
  h+='<button class="btn" id="home">Continue · आगे बढ़ें</button></div>';$('app').innerHTML=h;window.scrollTo(0,0);$('home').onclick=home;}
if(TOKEN)home();else renderLogin();
</script></body></html>
